<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Display</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>ESP32 Display Monitor</h1>

        <div class="card">
            <h2>Live OLED Mirror (<span id="status">Disconnected</span>)</h2>
            <canvas id="oledCanvas" width="128" height="64"></canvas>
        </div>

        <div class="card">
            <h2>Settings</h2>
            <form id="settings-form">
                <label>Station Code
                    <input type="text" id="ns_station_code" maxlength="8" placeholder="e.g. Amf" required />
                </label>

                <label>API Key
                    <input type="password" id="ns_api_key" maxlength="64" placeholder="NS API Subscription Key"
                        required />
                </label>

                <label>Screen Dwell Ticks
                    <input type="number" id="screen_dwell_ticks" min="1" required />
                </label>

                <label>Toggle Phase Ticks
                    <input type="number" id="toggle_phase_ticks" min="1" required />
                </label>

                <label>Scroll Pause Ticks
                    <input type="number" id="scroll_pause_ticks" min="0" required />
                </label>

                <button type="submit">Save Settings</button>
            </form>
            <div id="status-msg"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
